def flywayUrl = System.getenv('FLYWAY_URL') ?: 'jdbc:postgresql://localhost:5432/ordermesh-retry'
def flywayUser = System.getenv('FLYWAY_USER') ?: 'user'
def flywayPassword = System.getenv('FLYWAY_PASSWORD') ?: 'password'
def flywayLocations = ["filesystem:${project.projectDir}/src/main/resources/db/migration"]
def flywayJdbc = configurations.maybeCreate('flywayJdbc')
def flywayClass = project.buildscript.classLoader.loadClass('org.flywaydb.core.Flyway')

dependencies.add(flywayJdbc.name, 'org.postgresql:postgresql:42.7.3')

flyway {
	url = flywayUrl
	user = flywayUser
	password = flywayPassword
	locations = flywayLocations
	schemas = ['public']
	defaultSchema = 'public'
	baselineVersion = '0'
}

tasks.register('flywayMigrateAll') {
	group = 'Flyway'
	description = 'Apply migrations to every non-system schema in the target database'

	doLast {
		def driverClassLoader = new java.net.URLClassLoader(
				flywayJdbc.files.collect { it.toURI().toURL() } as URL[],
				ClassLoader.systemClassLoader
		)
		try {
			def connectionProperties = new Properties()
			connectionProperties.setProperty('user', flywayUser)
			connectionProperties.setProperty('password', flywayPassword)
			def driver = driverClassLoader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
			def connection = driver.connect(flywayUrl, connectionProperties)
			def targetSchemas = []
			try {
				def statement = connection.createStatement()
				def resultSet = statement.executeQuery('''
					SELECT schema_name
					FROM information_schema.schemata
					WHERE schema_name NOT IN ('pg_catalog', 'information_schema', 'pg_toast')
					  AND schema_name NOT LIKE 'pg_temp%'
					  AND schema_name NOT LIKE 'pg_toast_temp%'
					ORDER BY schema_name
				''')
				while (resultSet.next()) {
					targetSchemas << resultSet.getString('schema_name')
				}
			} finally {
				connection.close()
			}

			if (targetSchemas.isEmpty()) {
				throw new GradleException("No schemas found to migrate: ${flywayUrl}")
			}

			def originalContextClassLoader = Thread.currentThread().contextClassLoader
			Thread.currentThread().contextClassLoader = project.buildscript.classLoader
			try {
				targetSchemas.each { schemaName ->
					logger.lifecycle("Flyway migrate schema=${schemaName}")
					flywayClass.configure()
							.dataSource(flywayUrl, flywayUser, flywayPassword)
							.locations(flywayLocations as String[])
							.schemas(schemaName)
							.defaultSchema(schemaName)
							.createSchemas(true)
							.baselineOnMigrate(true)
							.baselineVersion('0')
							.load()
							.migrate()
				}
			} finally {
				Thread.currentThread().contextClassLoader = originalContextClassLoader
			}
		} finally {
			driverClassLoader.close()
		}
	}
}
