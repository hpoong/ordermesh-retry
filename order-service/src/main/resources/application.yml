spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password
    virtual-host: ordermesh-retry
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/ordermesh-retry
    username: user
    password: password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

logging:
  config: classpath:logback/logback-spring.xml
  level:
    root: info

app:
  slow-query:
    threshold-ms: 1000
  event-outbox:
    publish:
      enabled: true
      batch-size: 20
      max-attempts: 10
      retry-delay-seconds: 30
      fixed-delay-ms: 60000 # 1분

server:
  port: 9100
