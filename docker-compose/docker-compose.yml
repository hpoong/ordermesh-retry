services:

  loki:
    image: grafana/loki:3.7.4
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - rdermesh-retry-loki-volumes:/loki
    networks:
      - ordermesh-retry-network

  tempo:
    image: grafana/tempo:2.7.1
    command: [ "-config.file=/etc/tempo/config.yml" ]
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - rdermesh-retry-tempo-volumes:/var/tempo
    networks:
      - ordermesh-retry-network

  fluent-bit:
    image: fluent/fluent-bit:5.1.0
    depends_on:
      - loki
    ports:
      - "2020:2020"
    volumes:
      - /var/log/ordermesh-retry:/var/log/ordermesh-retry:ro
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./fluent-bit/jobs:/fluent-bit/etc/jobs:ro # project 별 job 라벨 분리
      - rdermesh-retry-fluent-bit-volumes:/fluent-bit/state
    networks:
      - ordermesh-retry-network

  rabbitmq-service:
    image: rabbitmq:3.13.0-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: ordermesh-retry
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ordermesh-retry-network

  postgres-service:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ordermesh-retry
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./conf:/etc/postgresql/conf.d
    networks:
      - ordermesh-retry-network

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - ./redis-data:/data
    networks:
      - ordermesh-retry-network

networks:
  ordermesh-retry-network:
    driver: bridge

volumes:
  rdermesh-retry-loki-volumes:
  rdermesh-retry-tempo-volumes:
  rdermesh-retry-fluent-bit-volumes:
