[INPUT]
    Name                      tail
    Tag                       job.ordermesh-retry
    # <service> 디렉터리 아래 로그를 모두 수집 (account, order, 이후 추가 서비스 포함)
    Path                      /var/log/ordermesh-retry/*/*.log
    Exclude_Path              /var/log/ordermesh-retry/*/*-error.log
    Path_Key                  source
    DB                        /fluent-bit/state/ordermesh-retry.db
    DB.Sync                   Normal
    Read_from_Head            True
    Refresh_Interval          5
    Rotate_Wait               30
    Mem_Buf_Limit             10MB
    Skip_Long_Lines           On

[FILTER]
    Name                      parser
    Match                     job.ordermesh-retry
    Key_Name                  source
    Parser                    ordermesh_retry_service
    Reserve_Data              On
    Preserve_Key              On

[OUTPUT]
    Name                      loki
    Match                     job.ordermesh-retry
    Host                      loki
    Port                      3100
    Labels                    job=ordermesh-retry, collector=fluent-bit
    Label_Keys                $service
    Line_Format               json
    Retry_Limit               False
