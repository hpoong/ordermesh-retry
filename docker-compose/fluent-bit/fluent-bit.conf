[SERVICE]
    Flush                     1
    Daemon                    Off
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Parsers_File              /fluent-bit/etc/parsers.conf

[INPUT]
    Name                      tail
    Tag                       application.*
    # <service> 디렉터리 아래 로그를 모두 수집 (account, order, 이후 추가 서비스 포함)
    Path                      /Users/ho_poong/log/ordermesh-retry/*/*.log
    Exclude_Path              /Users/ho_poong/log/ordermesh-retry/*/*-error.log
    Path_Key                  source
    DB                        /fluent-bit/state/tail.db
    DB.Sync                   Normal
    Read_from_Head            True
    Refresh_Interval          5
    Rotate_Wait               30
    Mem_Buf_Limit             10MB
    Skip_Long_Lines           On

[FILTER]
    Name                      parser
    Match                     application.*
    Key_Name                  source
    Parser                    service_from_path
    Reserve_Data              On
    Preserve_Key              On

[OUTPUT]
    Name                      loki
    Match                     application.*
    Host                      loki
    Port                      3100
    Labels                    job=ordermesh-retry, collector=fluent-bit
    Label_Keys                $service
    Line_Format               json
    Retry_Limit               False

