# 수집 대상: com.docker.compose.project=simple-retry 인 컨테이너 stdout/stderr
# 앱 실행 예시:
#   docker compose -p simple-retry up -d
#
# Loki label:
#   project = com.docker.compose.project  (1뎁스)
#   service = com.docker.compose.service  (2뎁스)
#
# Fluent Bit 5.x: docker filter 제거됨 → lua로 container_name·compose label 보강

[INPUT]
    Name              tail
    Tag               docker.<container_id>
    Tag_Regex         (?<container_id>[a-f0-9]{64})-json\.log$
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/state/docker-containers.db
    DB.Sync           Normal
    Read_from_Head    False
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name              lua
    Match             docker.*
    Script            /fluent-bit/etc/docker-metadata.lua
    Call              enrich_docker_metadata

[FILTER]
    Name              grep
    Match             docker.*
    Regex             project simple-retry
    Exclude           container_name /simple-retry-fluent-bit

[OUTPUT]
    Name              loki
    Match             docker.*
    # 사내 PC 중앙 Loki — 배포 전 IP 수정
    Host              113.2.732.43
    Port              3100
    Labels            collector=fluent-bit, env=dev
    Label_Keys        $project,$service
    Line_Format       json
    Retry_Limit       False
