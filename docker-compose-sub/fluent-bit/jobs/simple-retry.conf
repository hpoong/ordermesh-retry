[INPUT]
    Name                      tail
    Tag                       job.simple-retry
    # <service> 디렉터리 아래 로그를 모두 수집
    Path                      /var/log/simple-retry/*/*.log
    Exclude_Path              /var/log/simple-retry/*/*-error.log
    Path_Key                  source
    DB                        /fluent-bit/state/simple-retry.db
    DB.Sync                   Normal
    Read_from_Head            True
    Refresh_Interval          5
    Rotate_Wait               30
    Mem_Buf_Limit             10MB
    Skip_Long_Lines           On

[FILTER]
    Name                      parser
    Match                     job.simple-retry
    Key_Name                  source
    Parser                    simple_retry_service
    Reserve_Data              On
    Preserve_Key              On

[OUTPUT]
    Name                      loki
    Match                     job.simple-retry
    # 사내 PC 중앙 Loki — 배포 전 IP 수정
    Host                      113.2.732.43
    Port                      3100
    Labels                    job=simple-retry, collector=fluent-bit, env=dev
    Label_Keys                $service
    Line_Format               json
    Retry_Limit               False
