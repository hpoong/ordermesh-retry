# 수집 대상: com.docker.compose.project=simple-retry 인 컨테이너 stdout/stderr
# 앱 실행 예시:
#   docker compose -p simple-retry up -d
#
# Loki label:
#   project = com.docker.compose.project  (1뎁스)
#   service = com.docker.compose.service  (2뎁스)

[INPUT]
    Name              tail
    Tag               docker.containers
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/state/docker-containers.db
    DB.Sync           Normal
    Read_from_Head    False
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name              docker
    Match             docker.containers
    Docker_URL        unix:///var/run/docker.sock
    TLS.Verify        Off

[FILTER]
    Name              grep
    Match             docker.containers
    Regex             container_label_com_docker_compose_project simple-retry
    Exclude           container_name simple-retry-fluent-bit

[FILTER]
    Name              modify
    Match             docker.containers
    Copy              container_label_com_docker_compose_project project
    Copy              container_label_com_docker_compose_service service

[OUTPUT]
    Name              loki
    Match             docker.containers
    # 사내 PC 중앙 Loki — 배포 전 IP 수정
    Host              113.2.732.43
    Port              3100
    Labels            collector=fluent-bit, env=dev
    Label_Keys        $project,$service
    Line_Format       json
    Retry_Limit       False
