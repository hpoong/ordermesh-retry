# 앱 컨테이너는 project 이름을 simple-retry 로 맞춰 실행하세요.
#   docker compose -p simple-retry up -d
# → Loki label: project=simple-retry, service=<compose service명>

services:

  fluent-bit:
    image: fluent/fluent-bit:5.1.0
    container_name: simple-retry-fluent-bit
    restart: unless-stopped
    user: root
    ports:
      - "2020:2020"
    volumes:
      # 컨테이너 stdout/stderr(json-file) 로그 수집
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./fluent-bit/docker-metadata.lua:/fluent-bit/etc/docker-metadata.lua:ro
      - ./fluent-bit/jobs:/fluent-bit/etc/jobs:ro
      - simple-retry-fluent-bit-state:/fluent-bit/state

volumes:
  simple-retry-fluent-bit-state:
